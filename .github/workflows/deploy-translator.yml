name: Deploy translator site

on:
  push:
    branches: [main]
    paths:
      - 'translator-site/**'
      - 'dubbing-core/**'
      - 'resource-studio/src/lib/generated-dubbing-catalogue.ts'
      - 'resource-studio/src/lib/dubbing.ts'
      - 'resource-studio/src/lib/formats.ts'
      - 'resource-studio/src/lib/stored-zip.ts'
      - 'resource-studio/src/lib/voice-formats.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: translator-site
      - run: bun run build
        working-directory: translator-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: translator-site/build
      - id: deployment
        uses: actions/deploy-pages@v4
