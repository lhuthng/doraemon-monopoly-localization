name: Deploy translator site

on:
  push:
    branches: [main]
    paths:
      - 'apps/translator-workshop/**'
      - 'packages/dubbing-core/**'
      - 'apps/resource-studio/src/lib/generated-dubbing-catalogue.ts'
      - 'packages/dubbing-core/src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/translator-workshop
      - run: bun run build
        working-directory: apps/translator-workshop
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/translator-workshop/build
      - id: deployment
        uses: actions/deploy-pages@v4
